<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NekoCraft 2048</title>
    <!-- Dynamic SVG Favicon for 2048 Tab Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23edc22e'/><text x='50' y='62' font-family='Arial, sans-serif' font-weight='bold' font-size='34' fill='%23f9f6f2' text-anchor='middle'>2048</text></svg>">
    <style>
        :root {
            --bg-color: #bbada0;
            --tile-bg: #cdc1b4;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
            --mask-bg: rgba(40, 40, 40, 0.85);
        }

        body {
            background-color: #faf8ef;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100vh; margin: 0; padding-top: 15px;
            touch-action: none; overflow: hidden; box-sizing: border-box;
            user-select: none; -webkit-user-select: none;
        }

        .brand-name {
            color: #776e65; font-size: 34px; font-weight: bold; margin: 0 0 8px 0;
            letter-spacing: -1px; text-align: center;
        }

        #start-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--mask-bg); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; backdrop-filter: blur(8px); transition: opacity 0.4s ease;
            text-align: center; cursor: pointer;
        }

        .swipe-icon {
            width: 80px; height: 80px; border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; position: relative; margin-bottom: 30px;
        }
        .swipe-dot {
            width: 20px; height: 20px; background: white; border-radius: 50%;
            position: absolute; top: 30px; left: 30px;
            animation: swipeAnim 2s infinite ease-in-out;
        }
        @keyframes swipeAnim {
            0% { transform: translateX(-30px); opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translateX(30px); opacity: 0; }
        }

        .keys-icon { display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; margin-bottom: 30px; }
        .key {
            width: 44px; height: 44px; border: 2px solid white; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; fill: white;
            box-sizing: border-box;
        }
        .key svg { width: 22px; height: 22px; }
        .key.active { animation: keyPress 1.5s infinite; }
        @keyframes keyPress {
            0%, 100% { background: transparent; fill: white; }
            50% { background: white; fill: #282828; }
        }

        .header { width: 90vw; max-width: 400px; display: flex; justify-content: center; margin-bottom: 12px; }
        .scores-wrapper { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .score-box { background: #bbada0; padding: 6px 15px; border-radius: 6px; color: white; text-align: center; min-width: 70px; }
        .score-label { font-size: 11px; display: block; color: #eee4da; font-weight: bold; text-transform: uppercase; }
        .score-value { font-size: 20px; font-weight: bold; }

        #game-wrapper { position: relative; width: 90vw; height: 90vw; max-width: 380px; max-height: 380px; }
        canvas { background-color: var(--bg-color); border-radius: 6px; width: 100%; height: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.12); cursor: grab; }
        canvas:active { cursor: grabbing; }

        #game-over {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238, 228, 218, 0.95); z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 6px; text-align: center; padding: 20px; box-sizing: border-box;
        }

        .btn {
            background: #8f7a66; color: white; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-restart { background-color: #776e65; }
        .btn-leaderboard { background-color: #e67e22; }

        .button-group { display: flex; gap: 10px; margin-top: 12px; }

        /* Leaderboard Modal */
        #leaderboard-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 2000;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #faf8ef; width: 85vw; max-width: 360px;
            border-radius: 8px; padding: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 80vh; display: flex; flex-direction: column;
        }
        .modal-title { color: #776e65; font-size: 24px; margin: 0 0 15px 0; }
        .leaderboard-list {
            list-style: none; padding: 0; margin: 0 0 15px 0;
            overflow-y: auto; text-align: left;
        }
        .leaderboard-item {
            display: flex; justify-content: space-between;
            padding: 8px 12px; border-bottom: 1px solid #e0d9d0;
            font-size: 14px; color: #776e65;
        }
        .leaderboard-item:nth-child(1) { font-weight: bold; color: #d35400; }
        .leaderboard-item:nth-child(2) { font-weight: bold; color: #27ae60; }
        .leaderboard-item:nth-child(3) { font-weight: bold; color: #2980b9; }

        /* Submit Score Form */
        .submit-box { margin-bottom: 15px; display: flex; gap: 6px; width: 100%; }
        .submit-input {
            flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 14px; outline: none;
        }

        footer { margin-top: auto; padding-bottom: 15px; text-align: center; }
        .cookie-note { color: #b0a89f; font-size: 11px; margin-bottom: 4px; }
        .developer-info { color: #8f7a66; font-size: 12px; margin-bottom: 4px; font-weight: bold; }
        .developer-info a { color: #8f7a66; text-decoration: underline; }
        .developer-info a:hover { color: #776e65; }
        .copyright { color: #b0a89f; font-size: 12px; letter-spacing: 1px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="start-mask" onclick="startGame()">
        <div id="icon-container"></div>
        <h2 id="instruction-text" style="letter-spacing: 2px; margin: 10px 0;"></h2>
        <p id="click-to-start" style="opacity: 0.6; font-size: 14px;"></p>
    </div>

    <h1 class="brand-name">NekoCraft 2048</h1>

    <div class="header">
        <div class="scores-wrapper">
            <div class="score-box"><span id="lbl-score" class="score-label"></span><span id="score" class="score-value">0</span></div>
            <div class="score-box"><span id="lbl-best" class="score-label"></span><span id="best-score" class="score-value">0</span></div>
        </div>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="game-over">
            <h2 id="go-title" style="font-size: 36px; color: #776e65; margin: 0 0 10px 0;">Game Over!</h2>
            <p id="final-status" style="color: #776e65; font-size: 16px; line-height: 1.5; margin-bottom: 15px;"></p>
            
            <div class="submit-box" id="submit-section">
                <input type="text" id="player-name" class="submit-input" placeholder="輸入你的名字" maxlength="12">
                <button class="btn" style="background-color: #27ae60;" onclick="submitScore()">提交分數</button>
            </div>

            <button id="btn-retry" class="btn" onclick="resetGame()"></button>
        </div>
    </div>

    <div class="button-group">
        <button id="btn-restart" class="btn btn-restart" onclick="resetGame()"></button>
        <button class="btn btn-leaderboard" onclick="openLeaderboard()">🏆 排行榜</button>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal">
        <div class="modal-content">
            <h3 class="modal-title">🏆 全球英雄榜</h3>
            <ul id="leaderboard-list" class="leaderboard-list">
                <li class="leaderboard-item">載入中...</li>
            </ul>
            <button class="btn btn-restart" onclick="closeLeaderboard()">關閉</button>
        </div>
    </div>

    <footer>
        <div class="cookie-note">本網頁使用 Cookies 技術紀錄你的遊玩存檔，即使退出也會保留數據</div>
        <div class="developer-info">開發者：edmond | 官網：<a href="https://www.nekoqwq.com/" target="_blank" rel="noopener noreferrer">https://www.nekoqwq.com/</a></div>
        <div class="copyright">&copy; 2026 NekoCraft</div>
    </footer>

    <script>
        const i18n = {
            zh_TW: {
                instruction_mobile: "滑動螢幕來遊玩",
                instruction_pc: "使用方向鍵或滑動來遊玩",
                click_start: "點擊任意處開始遊玩",
                score: "得分",
                best: "最高",
                retry: "再玩一次",
                restart: "重新遊玩",
                status: "本次得分：<strong>{s}</strong><br>最高紀錄：<strong>{b}</strong>"
            },
            zh_CN: {
                instruction_mobile: "滑动屏幕来游玩",
                instruction_pc: "使用方向键或滑动来游玩",
                click_start: "点击任意处開始游玩",
                score: "得分",
                best: "最高",
                retry: "再玩一次",
                restart: "重新游玩",
                status: "本次得分：<strong>{s}</strong><br>最高纪录：<strong>{b}</strong>"
            }
        };

        const lang = (navigator.language.toLowerCase().includes('tw') || 
                     navigator.language.toLowerCase().includes('hk') || 
                     navigator.language.toLowerCase().includes('mo')) ? i18n.zh_TW : i18n.zh_CN;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mask = document.getElementById('start-mask');
        const scoreDisplay = document.getElementById('score');
        const bestDisplay = document.getElementById('best-score');
        const gameOverScreen = document.getElementById('game-over');

        let board = [], score = 0, bestScore = 0, isAnimating = false, movingTiles = [];
        let hasSubmitted = false;
        const GRID_SIZE = 4, GAP = 12, ANIMATION_MS = 110;
        const colors = { 2: "#eee4da", 4: "#ede0c8", 8: "#f2b179", 16: "#f59563", 32: "#f67c5f", 64: "#f65e3b", 128: "#edcf72", 256: "#edcc61", 512: "#edc850", 1024: "#edc53f", 2048: "#edc22e" };

        const svgIcons = {
            up: `<svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>`,
            down: `<svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6v-8h-4v8h-6z"/></svg>`,
            left: `<svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>`,
            right: `<svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6h-8v4h8v6z"/></svg>`
        };

        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${date.toUTCString()};path=/;SameSite=Lax`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        function saveProgress() {
            setCookie('neko2048_board', JSON.stringify(board));
            setCookie('neko2048_score', score);
        }

        function clearProgress() {
            setCookie('neko2048_board', '', -1);
            setCookie('neko2048_score', '', -1);
        }

        function initUI() {
            document.getElementById('lbl-score').innerText = lang.score;
            document.getElementById('lbl-best').innerText = lang.best;
            document.getElementById('btn-retry').innerText = lang.retry;
            document.getElementById('btn-restart').innerText = lang.restart;
            document.getElementById('click-to-start').innerText = lang.click_start;
            
            bestScore = parseInt(getCookie('neko2048_best')) || 0;
            bestDisplay.innerText = bestScore;

            const isGuided = getCookie('neko2048_guided');
            if (isGuided) mask.style.display = 'none';

            const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const container = document.getElementById('icon-container');
            const text = document.getElementById('instruction-text');
            
            if (isTouch) {
                container.innerHTML = '<div class="swipe-icon"><div class="swipe-dot"></div></div>';
                text.innerText = lang.instruction_mobile;
            } else {
                container.innerHTML = `
                    <div class="keys-icon">
                        <div></div><div class="key active">${svgIcons.up}</div><div></div>
                        <div class="key active">${svgIcons.left}</div><div class="key active">${svgIcons.down}</div><div class="key active">${svgIcons.right}</div>
                    </div>`;
                text.innerText = lang.instruction_pc;
            }
        }

        function startGame() {
            setCookie('neko2048_guided', 'true');
            mask.style.opacity = '0';
            setTimeout(() => mask.style.display = 'none', 400);
        }

        function setupCanvas() {
            const size = Math.min(window.innerWidth * 0.9, 380);
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            ctx.scale(dpr, dpr);
        }

        function initGame() {
            const savedBoard = getCookie('neko2048_board');
            const savedScore = getCookie('neko2048_score');

            if (savedBoard && savedScore) {
                board = JSON.parse(savedBoard);
                score = parseInt(savedScore);
            } else {
                board = Array(4).fill().map(() => Array(4).fill(0));
                score = 0;
                addRandomTile(); addRandomTile();
            }
            
            scoreDisplay.innerText = score;
            gameOverScreen.style.display = 'none';
            draw(1);
        }

        function addRandomTile() {
            let empty = [];
            for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (board[r][c] === 0) empty.push({r, c});
            if (empty.length) {
                let {r, c} = empty[Math.floor(Math.random() * empty.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function draw(progress) {
            const size = canvas.width / (window.devicePixelRatio || 1);
            const cellSize = (size - (GRID_SIZE + 1) * GAP) / GRID_SIZE;
            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = "#cdc1b4";
            for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) fillRoundRect(GAP + c*(cellSize+GAP), GAP + r*(cellSize+GAP), cellSize, cellSize, 6);

            if (isAnimating) {
                movingTiles.forEach(t => drawTile(t.fromX + (t.toX-t.fromX)*progress, t.fromY + (t.toY-t.fromY)*progress, t.value, cellSize));
            } else {
                for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (board[r][c]) drawTile(c, r, board[r][c], cellSize);
            }
        }

        function drawTile(x, y, val, cellSize) {
            const rx = GAP + x * (cellSize + GAP), ry = GAP + y * (cellSize + GAP);
            ctx.fillStyle = colors[val] || "#3c3a32";
            fillRoundRect(rx, ry, cellSize, cellSize, 5);
            ctx.fillStyle = val <= 4 ? "#776e65" : "#f9f6f2";
            ctx.font = `bold ${val > 100 ? cellSize*0.35 : cellSize*0.45}px Arial`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(val, rx + cellSize/2, ry + cellSize/2);
        }

        function fillRoundRect(x, y, w, h, r) {
            ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
        }

        function move(dir) {
            if (isAnimating || gameOverScreen.style.display === 'flex') return;
            if (mask.style.display !== 'none') startGame();

            let oldBoard = JSON.stringify(board), nextBoard = Array(4).fill().map(() => Array(4).fill(0));
            movingTiles = [];

            for (let i = 0; i < 4; i++) {
                let line = [];
                for (let j = 0; j < 4; j++) {
                    let v = (dir === 'left' || dir === 'right') ? board[i][j] : board[j][i];
                    if (v) line.push({v, origin: j});
                }
                if (dir === 'right' || dir === 'down') line.reverse();

                let merged = [];
                for (let j = 0; j < line.length; j++) {
                    if (j+1 < line.length && line[j].v === line[j+1].v) {
                        let nv = line[j].v * 2; score += nv;
                        merged.push({v: nv, os: [line[j].origin, line[j+1].origin]}); j++;
                    } else merged.push({v: line[j].v, os: [line[j].origin]});
                }
                while(merged.length < 4) merged.push(null);
                if (dir === 'right' || dir === 'down') merged.reverse();

                merged.forEach((item, targetIdx) => {
                    if (!item) return;
                    item.os.forEach(orig => {
                        let m = { value: item.v };
                        if (dir === 'left' || dir === 'right') { m.fromX=orig; m.fromY=i; m.toX=targetIdx; m.toY=i; nextBoard[i][targetIdx]=item.v; }
                        else { m.fromX=i; m.fromY=orig; m.toX=i; m.toY=targetIdx; nextBoard[targetIdx][i]=item.v; }
                        movingTiles.push(m);
                    });
                });
            }

            if (oldBoard !== JSON.stringify(nextBoard)) {
                isAnimating = true; let start = null;
                requestAnimationFrame(function animate(t) {
                    if (!start) start = t;
                    let p = Math.min((t - start) / ANIMATION_MS, 1);
                    draw(p);
                    if (p < 1) requestAnimationFrame(animate);
                    else { 
                        board = nextBoard; isAnimating = false; addRandomTile(); 
                        updateUI(); saveProgress(); draw(1); checkGameOver(); 
                    }
                });
            }
        }

        function updateUI() {
            scoreDisplay.innerText = score;
            if (score > bestScore) { 
                bestScore = score; bestDisplay.innerText = bestScore; 
                setCookie('neko2048_best', bestScore);
            }
        }

        function checkGameOver() {
            let canMove = false;
            for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
                if (board[r][c] === 0) canMove = true;
                if (r < 3 && board[r][c] === board[r+1][c]) canMove = true;
                if (c < 3 && board[r][c] === board[r][c+1]) canMove = true;
            }
            if (!canMove) {
                document.getElementById('final-status').innerHTML = lang.status.replace('{s}', score).replace('{b}', bestScore);
                document.getElementById('submit-section').style.display = 'flex';
                hasSubmitted = false;
                gameOverScreen.style.display = 'flex';
                clearProgress();
            }
        }

        function resetGame() {
            clearProgress();
            board = Array(4).fill().map(() => Array(4).fill(0));
            score = 0; scoreDisplay.innerText = score;
            gameOverScreen.style.display = 'none';
            addRandomTile(); addRandomTile();
            saveProgress(); draw(1);
        }

        /* --- 排行榜 API 邏輯 --- */
        async function submitScore() {
            if (hasSubmitted) { alert("分數已經提交過囉！"); return; }
            const nameInput = document.getElementById('player-name');
            const nickname = nameInput.value.trim() || "無名貓咪";

            try {
                const res = await fetch('/api/leaderboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, score })
                });
                if (res.ok) {
                    alert("上榜成功！");
                    hasSubmitted = true;
                    document.getElementById('submit-section').style.display = 'none';
                    openLeaderboard();
                } else {
                    alert("提交失敗，請再試一次。");
                }
            } catch (err) {
                alert("網路連線錯誤。");
            }
        }

        async function openLeaderboard() {
            const modal = document.getElementById('leaderboard-modal');
            const list = document.getElementById('leaderboard-list');
            modal.style.display = 'flex';
            list.innerHTML = '<li class="leaderboard-item">載入中...</li>';

            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                
                if (data.length === 0) {
                    list.innerHTML = '<li class="leaderboard-item">目前還沒有玩家上榜喔！</li>';
                    return;
                }

                list.innerHTML = data.map((item, idx) => `
                    <li class="leaderboard-item">
                        <span>#${idx + 1} ${escapeHtml(item.nickname)}</span>
                        <span>${item.score} 分</span>
                    </li>
                `).join('');
            } catch (err) {
                list.innerHTML = '<li class="leaderboard-item">讀取排行榜失敗</li>';
            }
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-modal').style.display = 'none';
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        window.addEventListener('keydown', e => { if (e.key.includes('Arrow')) move(e.key.replace('Arrow', '').toLowerCase()); });
        
        let startX, startY, isDragging = false;

        function handleStart(x, y) {
            startX = x; startY = y; isDragging = true;
        }

        function handleEnd(x, y) {
            if (!isDragging) return;
            let dx = x - startX, dy = y - startY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) move(dx > 0 ? 'right' : 'left');
            } else {
                if (Math.abs(dy) > 30) move(dy > 0 ? 'down' : 'up');
            }
            isDragging = false;
        }

        canvas.addEventListener('touchstart', e => handleStart(e.touches[0].clientX, e.touches[0].clientY), {passive: true});
        canvas.addEventListener('touchend', e => handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY), {passive: true});

        canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
        window.addEventListener('mouseup', e => handleEnd(e.clientX, e.clientY));

        initUI(); setupCanvas(); initGame();
    </script>
</body>
</html>
